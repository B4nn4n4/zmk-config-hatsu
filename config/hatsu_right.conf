# User options applied on top of the board defconfigs.

# --- Diagnostic build (TEMPORARY) ---
# Mirror of the left-half battery diag. USB logging conflicts with nothing on
# the right (no Studio snippet). The right is the BLE peripheral with no VBUS
# sensing, so ZMK_SLEEP is disabled here to keep the gauge workqueue sampling
# the full capture instead of deep-sleeping ~15 min in.
CONFIG_ZMK_BATTERY_DIAG=y
CONFIG_ZMK_BATTERY_DIAG_INTERVAL_MS=3000
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=15
CONFIG_ZMK_SLEEP=n

# Mouse FTW
CONFIG_ZMK_POINTING=y
