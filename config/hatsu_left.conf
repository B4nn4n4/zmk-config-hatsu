# User options applied on top of the board defconfigs.

# --- Diagnostic build (TEMPORARY) ---
# The battery-diag logger stream needs the USB CDC ACM console, which conflicts
# with the ZMK Studio RPC snippet (both own that UART). Studio is disabled here
# and the studio-rpc-usb-uart snippet is dropped from build.yaml for now.
# Restore both after diagnosing the battery charge issue.
CONFIG_ZMK_BATTERY_DIAG=y
CONFIG_ZMK_BATTERY_DIAG_INTERVAL_MS=3000
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=15
# Silence the ZMK `zmk` module debug flood (zmk_usb_get_conn_state at 10x/s) so
# the diag vcell lines are visible. The `battery_diag` module logs at INF
# independently and is unaffected. WRN driver errors still print.
CONFIG_ZMK_LOGGING_MINIMAL=y

# ZMK Studio (also requires the studio-rpc-usb-uart snippet in build.yaml)
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# Mouse FTW
CONFIG_ZMK_POINTING=y
