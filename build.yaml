# This file tells the ZMK build workflow what firmware to build.
# See https://zmk.dev/docs/customization#building-additional-keyboards
---
include:
  - board: hatsu_left//zmk
  - board: hatsu_right//zmk
  # Wipes the settings partition (split-pairing bonds, BT bonds).
  # Flash to BOTH halves when they refuse to pair, then reflash normal firmware.
  - board: hatsu_left//zmk
    shield: settings_reset
  - board: hatsu_right//zmk
    shield: settings_reset
